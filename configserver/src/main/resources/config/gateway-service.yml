eureka:
  instance:
    # Register by IP: a machine's own hostname often doesn't resolve for the other services.
    prefer-ip-address: true
  client:
    # Local development: see new instances within seconds (the default is 30 s).
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
keycloak:
  admin:
    server-url: ${KEYCLOAK_URL:http://localhost:8181}
    realm: fitness-app
    client-id: fitlife-backend
    # Local-development default; it must match FITLIFE_BACKEND_CLIENT_SECRET in docker-compose.yml.
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:fitlife-local-dev-client-secret}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8181}/realms/fitness-app/protocol/openid-connect/certs
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: activity-service
              uri: lb://ACTIVITY-SERVICE
              predicates:
                - Path=/api/activities/**

            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/recommendations/**

server:
  port: 8080
